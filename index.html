<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>메모장</title>
<style>
  :root{
    --bg:#000; --fg:#fff; --sub:#888; --line:#444; --hl:#fff; --hlfg:#000;
    --fs-base:16px; --fs-title:15px; --fs-small:12px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    width:100%; height:100%;
    overflow:hidden;
    position:fixed;
    inset:0;
    background:#222;
    display:flex; align-items:center; justify-content:center;
    font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    touch-action:none;
    overscroll-behavior:none;
  }
  #phone-outer{
    width:100%; height:100%;
    display:flex; align-items:stretch; justify-content:stretch;
    overflow:hidden;
  }
  #phone{
    width:100%; height:100%;
    flex:1 1 auto;
    background:var(--bg);
    color:var(--fg);
    display:flex; flex-direction:column;
    overflow:hidden;
    position:relative;
  }
  #body{
    flex:1 1 auto;
    overflow:hidden;
    position:relative;
  }
  .screen{
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:none;
    flex-direction:column;
  }
  .screen.active{ display:flex; }

  /* LIST */
  #list-items{
    flex:1 1 auto;
    overflow-y:auto;
  }
  .item{
    padding:18px 20px;
    border-bottom:1px solid var(--line);
    font-size:var(--fs-base);
    display:flex; flex-direction:column; gap:4px;
    cursor:pointer;
  }
  .item .t{
    font-size:calc(var(--fs-base) + 2px);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .item .d{
    font-size:var(--fs-small); color:var(--sub);
  }
  .item:active{ background:var(--hl); color:var(--hlfg); }
  .item:active .d{ color:#555; }
  #empty{
    flex:1; display:flex; align-items:center; justify-content:center;
    color:var(--sub); font-size:var(--fs-base);
  }

  /* DETAIL */
  #detail{
    flex:1; overflow-y:auto; padding:24px; font-size:var(--fs-base); line-height:1.7;
    display:flex; flex-direction:column;
  }
  #detail-date{
    color:var(--sub); font-size:var(--fs-small);
    display:block;
    padding-bottom:12px;
    margin-bottom:18px;
    border-bottom:1px solid var(--line);
    flex:0 0 auto;
  }
  #detail-body{
    white-space:pre-wrap; word-break:break-all;
    flex:1 1 auto;
  }

  /* WRITE */
  #write-textarea{
    flex:1; width:100%; background:var(--bg); color:var(--fg);
    border:none; outline:none; resize:none;
    padding:24px; font-size:var(--fs-base); line-height:1.7;
    font-family:inherit;
  }

  /* TOOLBAR (button row, replaces keypad shortcuts) */
  #toolbar{
    flex:0 0 auto;
    display:flex;
    border-top:1px solid var(--line);
  }
  #toolbar button{
    flex:1;
    background:var(--bg); color:var(--fg);
    border:none; border-right:1px solid var(--line);
    padding:16px 4px;
    font-size:calc(var(--fs-base) - 2px);
    font-family:inherit;
    cursor:pointer;
  }
  #toolbar button:last-child{ border-right:none; }
  #toolbar button:active{ background:var(--hl); color:var(--hlfg); }
  #toolbar button:disabled{ color:var(--sub); }
  #toolbar .danger:active{ background:var(--fg); }

  /* Floating settings button */
  #settings-btn{
    position:absolute;
    top:14px; right:14px;
    width:40px; height:40px;
    border:1px solid var(--fg);
    border-radius:50%;
    background:var(--bg); color:var(--fg);
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
    z-index:15;
    cursor:pointer;
  }
  #settings-btn:active{ background:var(--hl); color:var(--hlfg); }

  #page-indicator{
    position:absolute;
    top:18px; left:16px;
    font-size:var(--fs-small);
    color:var(--sub);
    z-index:10;
  }

  /* CONFIRM MODAL */
  #confirm-modal, #settings-modal{
    position:absolute; left:40px; right:40px; top:50%; transform:translateY(-50%);
    background:var(--fg); color:var(--hlfg);
    border:2px solid var(--fg);
    padding:24px 20px;
    display:none;
    flex-direction:column;
    gap:18px;
    z-index:20;
    font-size:var(--fs-base);
  }
  #confirm-modal.active, #settings-modal.active{ display:flex; }
  #confirm-modal .opts{
    display:flex; gap:12px;
  }
  #confirm-modal .opts button{
    flex:1;
    padding:14px;
    font-size:var(--fs-base);
    font-family:inherit;
    border:1px solid var(--hlfg);
    background:var(--fg); color:var(--hlfg);
    cursor:pointer;
  }
  #confirm-modal .opts button.danger{ background:var(--hlfg); color:var(--fg); }

  #settings-modal h3{ font-size:calc(var(--fs-base) + 2px); margin-bottom:4px; }
  .setting-row{ display:flex; flex-direction:column; gap:8px; }
  .setting-row label{ font-size:var(--fs-small); color:#555; }
  .setting-row .choices{ display:flex; gap:8px; }
  .setting-row .choices button{
    flex:1; padding:10px; font-size:var(--fs-small);
    border:1px solid var(--hlfg); background:var(--fg); color:var(--hlfg);
    font-family:inherit; cursor:pointer;
  }
  .setting-row .choices button.active{ background:var(--hlfg); color:var(--fg); }
  #settings-close{
    margin-top:6px; padding:14px; font-size:var(--fs-base);
    border:1px solid var(--hlfg); background:var(--hlfg); color:var(--fg);
    font-family:inherit; cursor:pointer;
  }

  #newbtn{
    position:absolute;
    right:16px; bottom:80px;
    width:52px; height:52px;
    border-radius:50%;
    border:1px solid var(--fg);
    display:flex; align-items:center; justify-content:center;
    font-size:26px;
    background:var(--bg); color:var(--fg);
    z-index:10;
    cursor:pointer;
  }
  #newbtn:active{ background:var(--hl); color:var(--hlfg); }
</style>
</head>
<body>
<div id="phone-outer">
<div id="phone">
  <div id="settings-btn">⚙</div>

  <div id="body">
    <!-- LIST SCREEN -->
    <div class="screen active" id="screen-list">
      <div id="page-indicator"></div>
      <div id="list-items"></div>
      <div id="empty" style="display:none;">메모가 없습니다</div>
      <div id="newbtn">+</div>
      <div id="toolbar">
        <button id="btn-prev">◀ 이전</button>
        <button id="btn-newmemo">새 메모</button>
        <button id="btn-next">다음 ▶</button>
      </div>
    </div>

    <!-- DETAIL SCREEN -->
    <div class="screen" id="screen-detail">
      <div id="detail">
        <span id="detail-date"></span>
        <span id="detail-body"></span>
      </div>
      <div id="toolbar">
        <button id="btn-edit">편집</button>
        <button id="btn-tolist">목록</button>
        <button id="btn-delete" class="danger">삭제</button>
      </div>
    </div>

    <!-- WRITE SCREEN -->
    <div class="screen" id="screen-write">
      <textarea id="write-textarea" placeholder="메모를 입력하세요..."></textarea>
      <div id="toolbar">
        <button id="btn-save">저장</button>
      </div>
    </div>

    <div id="confirm-modal">
      <div>정말 삭제하시겠습니까?</div>
      <div class="opts">
        <button class="danger" id="confirm-yes">삭제</button>
        <button id="confirm-no">취소</button>
      </div>
    </div>

    <div id="settings-modal">
      <h3>설정</h3>
      <div class="setting-row">
        <label>글자 크기</label>
        <div class="choices" id="fontsize-choices">
          <button data-size="14">작게</button>
          <button data-size="16">보통</button>
          <button data-size="20">크게</button>
          <button data-size="24">아주 크게</button>
        </div>
      </div>
      <div class="setting-row">
        <label>화면 색상</label>
        <div class="choices" id="theme-choices">
          <button data-theme="dark">검정 배경</button>
          <button data-theme="light">흰색 배경</button>
        </div>
      </div>
      <button id="settings-close">닫기</button>
    </div>
  </div>
</div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "memoapp_v1_notes";
  var SETTINGS_KEY = "memoapp_v1_settings";
  var PAGE_SIZE = 8;
  var PHONE_W = 768, PHONE_H = 1024;

  var state = {
    notes: [],
    mode: "list",
    page: 0,
    currentNoteId: null,
    editingNoteId: null,
    confirmOpen: false,
    settingsOpen: false
  };

  var settings = { fontSize: 16, theme: "dark" };

  // ---------- storage ----------
  function loadNotes(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      state.notes = raw ? JSON.parse(raw) : [];
    }catch(e){ state.notes = []; }
  }
  function saveNotes(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.notes)); }catch(e){}
  }
  function loadSettings(){
    try{
      var raw = localStorage.getItem(SETTINGS_KEY);
      if(raw){ var s = JSON.parse(raw); settings.fontSize = s.fontSize || 16; settings.theme = s.theme || "dark"; }
    }catch(e){}
  }
  function saveSettings(){
    try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(e){}
  }
  function applySettings(){
    document.documentElement.style.setProperty("--fs-base", settings.fontSize + "px");
    if(settings.theme === "light"){
      document.documentElement.style.setProperty("--bg", "#fff");
      document.documentElement.style.setProperty("--fg", "#000");
      document.documentElement.style.setProperty("--sub", "#666");
      document.documentElement.style.setProperty("--line", "#ccc");
      document.documentElement.style.setProperty("--hl", "#000");
      document.documentElement.style.setProperty("--hlfg", "#fff");
    } else {
      document.documentElement.style.setProperty("--bg", "#000");
      document.documentElement.style.setProperty("--fg", "#fff");
      document.documentElement.style.setProperty("--sub", "#888");
      document.documentElement.style.setProperty("--line", "#444");
      document.documentElement.style.setProperty("--hl", "#fff");
      document.documentElement.style.setProperty("--hlfg", "#000");
    }
    // update settings modal button active states
    document.querySelectorAll("#fontsize-choices button").forEach(function(b){
      b.classList.toggle("active", parseInt(b.dataset.size,10) === settings.fontSize);
    });
    document.querySelectorAll("#theme-choices button").forEach(function(b){
      b.classList.toggle("active", b.dataset.theme === settings.theme);
    });
  }

  function sortedNotes(){
    return state.notes.slice().sort(function(a,b){ return b.updatedAt - a.updatedAt; });
  }
  function totalPages(){
    var n = state.notes.length;
    return Math.max(1, Math.ceil(n / PAGE_SIZE));
  }

  // ---------- DOM refs ----------
  var $list = document.getElementById("list-items");
  var $empty = document.getElementById("empty");
  var $pageIndicator = document.getElementById("page-indicator");
  var $screenList = document.getElementById("screen-list");
  var $screenDetail = document.getElementById("screen-detail");
  var $screenWrite = document.getElementById("screen-write");
  var $detailBody = document.getElementById("detail-body");
  var $detailDate = document.getElementById("detail-date");
  var $textarea = document.getElementById("write-textarea");
  var $confirmModal = document.getElementById("confirm-modal");
  var $settingsModal = document.getElementById("settings-modal");
  var $newbtn = document.getElementById("newbtn");
  var $btnPrev = document.getElementById("btn-prev");
  var $btnNext = document.getElementById("btn-next");
  var $btnNewMemo = document.getElementById("btn-newmemo");
  var $btnEdit = document.getElementById("btn-edit");
  var $btnToList = document.getElementById("btn-tolist");
  var $btnDelete = document.getElementById("btn-delete");
  var $btnSave = document.getElementById("btn-save");
  var $confirmYes = document.getElementById("confirm-yes");
  var $confirmNo = document.getElementById("confirm-no");
  var $settingsBtn = document.getElementById("settings-btn");
  var $settingsClose = document.getElementById("settings-close");

  function fmtDate(ts){
    var d = new Date(ts);
    function p(n){ return (n<10?"0":"")+n; }
    return d.getFullYear()+"."+p(d.getMonth()+1)+"."+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
  }

  // ---------- render ----------
  function render(){
    $screenList.classList.remove("active");
    $screenDetail.classList.remove("active");
    $screenWrite.classList.remove("active");

    if(state.mode === "list"){
      $screenList.classList.add("active");
      renderList();
    } else if(state.mode === "detail"){
      $screenDetail.classList.add("active");
      renderDetail();
    } else if(state.mode === "write"){
      $screenWrite.classList.add("active");
    }
  }

  function renderList(){
    var notes = sortedNotes();
    var tp = totalPages();
    if(state.page >= tp) state.page = tp - 1;
    if(state.page < 0) state.page = 0;

    var start = state.page * PAGE_SIZE;
    var pageNotes = notes.slice(start, start + PAGE_SIZE);

    $pageIndicator.textContent = notes.length ? ((state.page+1)+" / "+tp) : "";
    $btnPrev.disabled = state.page <= 0;
    $btnNext.disabled = state.page >= tp - 1;

    $list.innerHTML = "";
    if(pageNotes.length === 0){
      $empty.style.display = "flex";
      return;
    }
    $empty.style.display = "none";

    pageNotes.forEach(function(note){
      var div = document.createElement("div");
      div.className = "item";
      var firstLine = (note.text || "").split("\n")[0] || "(내용 없음)";
      div.innerHTML = '<div class="t"></div><div class="d"></div>';
      div.querySelector(".t").textContent = firstLine;
      div.querySelector(".d").textContent = fmtDate(note.updatedAt);
      div.addEventListener("click", function(){
        state.currentNoteId = note.id;
        state.mode = "detail";
        render();
      });
      $list.appendChild(div);
    });
  }

  function renderDetail(){
    var note = state.notes.find(function(n){ return n.id === state.currentNoteId; });
    if(!note){ goToList(); return; }
    $detailDate.textContent = fmtDate(note.updatedAt);
    $detailBody.textContent = note.text || "";
  }

  // ---------- actions ----------
  function goToList(){
    state.mode = "list";
    state.page = 0;
    closeConfirm();
    render();
  }

  function startEditCurrent(){
    var note = state.notes.find(function(n){ return n.id === state.currentNoteId; });
    if(!note) return;
    state.editingNoteId = note.id;
    $textarea.value = note.text || "";
    state.mode = "write";
    render();
    setTimeout(function(){ $textarea.focus(); }, 0);
  }

  function startNewNote(){
    state.editingNoteId = null;
    $textarea.value = "";
    state.mode = "write";
    render();
    setTimeout(function(){ $textarea.focus(); }, 0);
  }

  function saveAndExitWrite(){
    var text = $textarea.value;
    var hasContent = text.trim().length > 0;

    if(state.editingNoteId){
      var note = state.notes.find(function(n){ return n.id === state.editingNoteId; });
      if(note){
        if(hasContent){ note.text = text; note.updatedAt = Date.now(); }
        else { state.notes = state.notes.filter(function(n){ return n.id !== state.editingNoteId; }); }
      }
      saveNotes();
      if(hasContent){ state.mode = "detail"; state.currentNoteId = state.editingNoteId; }
      else { goToList(); return; }
    } else {
      if(hasContent){
        var id = "n" + Date.now() + Math.random().toString(36).slice(2,7);
        state.notes.push({ id:id, text:text, updatedAt: Date.now() });
        saveNotes();
        state.mode = "list";
        state.page = 0;
      } else {
        state.mode = "list";
      }
    }
    render();
  }

  function openConfirmDelete(){ state.confirmOpen = true; $confirmModal.classList.add("active"); }
  function closeConfirm(){ state.confirmOpen = false; $confirmModal.classList.remove("active"); }
  function confirmDeleteYes(){
    state.notes = state.notes.filter(function(n){ return n.id !== state.currentNoteId; });
    saveNotes();
    closeConfirm();
    goToList();
  }

  // ---------- button bindings ----------
  $newbtn.addEventListener("click", startNewNote);
  $btnNewMemo.addEventListener("click", startNewNote);
  $btnPrev.addEventListener("click", function(){ if(state.page>0){ state.page--; renderList(); } });
  $btnNext.addEventListener("click", function(){ if(state.page < totalPages()-1){ state.page++; renderList(); } });
  $btnEdit.addEventListener("click", startEditCurrent);
  $btnToList.addEventListener("click", goToList);
  $btnDelete.addEventListener("click", openConfirmDelete);
  $btnSave.addEventListener("click", saveAndExitWrite);
  $confirmYes.addEventListener("click", confirmDeleteYes);
  $confirmNo.addEventListener("click", closeConfirm);

  // settings modal
  $settingsBtn.addEventListener("click", function(){
    state.settingsOpen = true;
    $settingsModal.classList.add("active");
  });
  $settingsClose.addEventListener("click", function(){
    state.settingsOpen = false;
    $settingsModal.classList.remove("active");
  });
  document.querySelectorAll("#fontsize-choices button").forEach(function(b){
    b.addEventListener("click", function(){
      settings.fontSize = parseInt(b.dataset.size, 10);
      saveSettings(); applySettings();
    });
  });
  document.querySelectorAll("#theme-choices button").forEach(function(b){
    b.addEventListener("click", function(){
      settings.theme = b.dataset.theme;
      saveSettings(); applySettings();
    });
  });

  // back button on write screen still saves (browser/device back)
  window.addEventListener("popstate", function(){
    if(state.mode === "write"){ saveAndExitWrite(); history.pushState({app:true}, ""); }
  });
  history.pushState({app:true}, "");

  // Escape key also saves from write mode (desktop convenience)
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      if(state.settingsOpen){ $settingsClose.click(); return; }
      if(state.confirmOpen){ closeConfirm(); return; }
      if(state.mode === "write"){ saveAndExitWrite(); }
    }
  });

  // ---------- fill entire viewport, any orientation, no letterboxing ----------
  function fitScreen(){
    var vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    document.getElementById("phone").style.height = vh + "px";
  }
  fitScreen();
  window.addEventListener("resize", fitScreen);
  window.addEventListener("orientationchange", function(){ setTimeout(fitScreen, 100); });
  if(window.visualViewport){ window.visualViewport.addEventListener("resize", fitScreen); }

  // ---------- double-tap/double-click on margin toggles fullscreen ----------
  var $outer = document.getElementById("phone-outer");
  function toggleFullscreen(){
    if(!document.fullscreenElement){
      var el = document.documentElement;
      if(el.requestFullscreen){ el.requestFullscreen().catch(function(){}); }
      else if(el.webkitRequestFullscreen){ el.webkitRequestFullscreen(); }
    } else {
      if(document.exitFullscreen){ document.exitFullscreen().catch(function(){}); }
      else if(document.webkitExitFullscreen){ document.webkitExitFullscreen(); }
    }
  }
  document.body.addEventListener("dblclick", function(e){
    if(e.target.closest(".item") || e.target.closest("button") || e.target.closest("textarea")) return;
    toggleFullscreen();
  });
  var lastTap = 0;
  document.body.addEventListener("touchend", function(e){
    if(e.target.closest(".item") || e.target.closest("button") || e.target.closest("textarea")) return;
    var now = Date.now();
    if(now - lastTap < 350){ toggleFullscreen(); e.preventDefault(); }
    lastTap = now;
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "+" || e.key === "="){
      toggleFullscreen();
    }
  });

  // ---------- init ----------
  loadNotes();
  loadSettings();
  applySettings();
  render();
})();
</script>
</body>
</html>
