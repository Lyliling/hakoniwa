<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>메모장</title>
<style>
  :root{
    --bg:#000; --fg:#fff; --sub:#888; --line:#444; --hl:#fff; --hlfg:#000;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%;
    overflow:hidden;
    position:fixed;
    inset:0;
    background:#222;
    display:flex; align-items:center; justify-content:center;
    font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    touch-action:none;
    overscroll-behavior:none;
  }
  #phone-outer{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #phone{
    width:320px; height:480px;
    flex:0 0 auto;
    background:var(--bg);
    color:var(--fg);
    display:flex; flex-direction:column;
    overflow:hidden;
    position:relative;
    border:2px solid #555;
    transform-origin:center center;
  }
  #titlebar{
    height:36px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 10px;
    border-bottom:1px solid var(--line);
    font-size:14px; font-weight:bold;
  }
  #titlebar .page{
    font-size:11px; color:var(--sub); font-weight:normal;
  }
  #body{
    flex:1 1 auto;
    overflow:hidden;
    position:relative;
  }
  .screen{
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:none;
    flex-direction:column;
  }
  .screen.active{ display:flex; }

  /* LIST */
  #list-items{
    flex:1 1 auto;
    overflow:hidden;
  }
  .item{
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    font-size:13px;
    display:flex; flex-direction:column; gap:2px;
  }
  .item .t{
    font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .item .d{
    font-size:10px; color:var(--sub);
  }
  .item.sel{
    background:var(--hl); color:var(--hlfg);
  }
  .item.sel .d{ color:#555; }
  #empty{
    flex:1; display:flex; align-items:center; justify-content:center;
    color:var(--sub); font-size:13px;
  }

  /* DETAIL */
  #detail{
    flex:1; overflow-y:auto; padding:14px; font-size:14px; line-height:1.6;
    display:flex; flex-direction:column;
  }
  #detail-date{
    color:var(--sub); font-size:11px;
    display:block;
    padding-bottom:8px;
    margin-bottom:12px;
    border-bottom:1px solid var(--line);
    flex:0 0 auto;
  }
  #detail-body{
    white-space:pre-wrap; word-break:break-all;
    flex:1 1 auto;
  }

  /* WRITE */
  #write-textarea{
    flex:1; width:100%; background:var(--bg); color:var(--fg);
    border:none; outline:none; resize:none;
    padding:14px; font-size:16px; line-height:1.6;
    font-family:inherit;
  }

  /* CONFIRM MODAL */
  #confirm-modal{
    position:absolute; left:10px; right:10px; top:50%; transform:translateY(-50%);
    background:var(--fg); color:var(--hlfg);
    border:2px solid var(--fg);
    padding:16px 12px;
    display:none;
    flex-direction:column;
    gap:14px;
    z-index:20;
    font-size:13px;
  }
  #confirm-modal.active{ display:flex; }
  #confirm-modal .opts{
    display:flex; justify-content:space-between; font-size:12px;
  }
  #confirm-modal .opts span b{ display:block; text-align:center; font-size:15px; }

  #softkeys{
    flex:0 0 auto;
    height:34px;
    border-top:1px solid var(--line);
    display:flex;
    font-size:11px;
    color:var(--sub);
  }
  #softkeys .sk{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    border-right:1px solid var(--line);
    text-align:center;
    padding:0 2px;
  }
  #softkeys .sk:last-child{ border-right:none; }
  #softkeys .sk b{ color:var(--fg); }

  #newbtn{
    position:absolute;
    right:10px; bottom:44px;
    width:34px; height:34px;
    border:1px solid var(--fg);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    background:var(--bg); color:var(--fg);
  }
</style>
</head>
<body>
<div id="phone-outer">
<div id="phone">
  <div id="titlebar">
    <span id="title-text">메모장</span>
    <span class="page" id="title-page"></span>
  </div>

  <div id="body">
    <!-- LIST SCREEN -->
    <div class="screen active" id="screen-list">
      <div id="list-items"></div>
      <div id="empty" style="display:none;">메모가 없습니다</div>
      <div id="newbtn">+</div>
    </div>

    <!-- DETAIL SCREEN -->
    <div class="screen" id="screen-detail">
      <div id="detail">
        <span id="detail-date"></span>
        <span id="detail-body"></span>
      </div>
    </div>

    <!-- WRITE SCREEN -->
    <div class="screen" id="screen-write">
      <textarea id="write-textarea" placeholder="메모를 입력하세요..."></textarea>
    </div>

    <div id="confirm-modal">
      <div>정말 삭제하시겠습니까?</div>
      <div class="opts">
        <span><b>1</b>삭제</span>
        <span><b>2</b>취소</span>
      </div>
    </div>
  </div>

  <div id="softkeys">
    <div class="sk" id="sk-left">▲▼ 이동</div>
    <div class="sk" id="sk-mid">1 선택</div>
    <div class="sk" id="sk-right">◀▶ 페이지</div>
  </div>
</div>
</div>

<script>
(function(){
  "use strict";
  var PHONE_W = 320, PHONE_H = 480;
  var $phone = document.getElementById("phone");
  function fitScale(){
    var vw = window.innerWidth;
    var vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    var scale = Math.min(vw / PHONE_W, vh / PHONE_H, 1);
    $phone.style.transform = "scale(" + scale + ")";
  }
  fitScale();
  window.addEventListener("resize", fitScale);
  window.addEventListener("orientationchange", function(){ setTimeout(fitScale, 100); });
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", fitScale);
  }
})();
</script>
<script>
(function(){
  "use strict";

  var STORAGE_KEY = "memoapp_v1_notes";
  var PAGE_SIZE = 5;

  var state = {
    notes: [],          // {id, text, updatedAt}
    mode: "list",        // list | detail | write
    page: 0,
    selIndex: 0,         // index within current page (0..PAGE_SIZE-1)
    currentNoteId: null,
    editingNoteId: null, // when writing/editing an existing note
    confirmOpen: false
  };

  // ---------- storage ----------
  function loadNotes(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      state.notes = raw ? JSON.parse(raw) : [];
    }catch(e){
      state.notes = [];
    }
  }
  function saveNotes(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.notes));
    }catch(e){}
  }

  function sortedNotes(){
    // newest first
    return state.notes.slice().sort(function(a,b){ return b.updatedAt - a.updatedAt; });
  }

  function totalPages(){
    var n = state.notes.length;
    return Math.max(1, Math.ceil(n / PAGE_SIZE));
  }

  // ---------- DOM refs ----------
  var $list = document.getElementById("list-items");
  var $empty = document.getElementById("empty");
  var $titlePage = document.getElementById("title-page");
  var $titleText = document.getElementById("title-text");
  var $screenList = document.getElementById("screen-list");
  var $screenDetail = document.getElementById("screen-detail");
  var $screenWrite = document.getElementById("screen-write");
  var $detailBody = document.getElementById("detail-body");
  var $detailDate = document.getElementById("detail-date");
  var $textarea = document.getElementById("write-textarea");
  var $confirmModal = document.getElementById("confirm-modal");
  var $skLeft = document.getElementById("sk-left");
  var $skMid = document.getElementById("sk-mid");
  var $skRight = document.getElementById("sk-right");
  var $newbtn = document.getElementById("newbtn");

  function fmtDate(ts){
    var d = new Date(ts);
    function p(n){ return (n<10?"0":"")+n; }
    return d.getFullYear()+"."+p(d.getMonth()+1)+"."+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
  }

  // ---------- render ----------
  function render(){
    $screenList.classList.remove("active");
    $screenDetail.classList.remove("active");
    $screenWrite.classList.remove("active");

    if(state.mode === "list"){
      $screenList.classList.add("active");
      renderList();
      $titleText.textContent = "메모장";
      $skLeft.textContent = "▲▼ 이동";
      $skMid.textContent = "1 선택 / 0 새글";
      $skRight.textContent = "◀▶ 페이지";
    } else if(state.mode === "detail"){
      $screenDetail.classList.add("active");
      renderDetail();
      $titleText.textContent = "메모 보기";
      $titlePage.textContent = "";
      $skLeft.textContent = "1 편집";
      $skMid.textContent = "2 목록";
      $skRight.textContent = "3 삭제";
    } else if(state.mode === "write"){
      $screenWrite.classList.add("active");
      $titleText.textContent = "메모 작성";
      $titlePage.textContent = "";
      $skLeft.textContent = "";
      $skMid.textContent = "뒤로가기 = 저장";
      $skRight.textContent = "";
    }
  }

  function renderList(){
    var notes = sortedNotes();
    var tp = totalPages();
    if(state.page >= tp) state.page = tp - 1;
    if(state.page < 0) state.page = 0;

    var start = state.page * PAGE_SIZE;
    var pageNotes = notes.slice(start, start + PAGE_SIZE);

    if(state.selIndex >= pageNotes.length) state.selIndex = Math.max(0, pageNotes.length - 1);
    if(state.selIndex < 0) state.selIndex = 0;

    $titlePage.textContent = notes.length ? ((state.page+1)+" / "+tp) : "";

    $list.innerHTML = "";
    if(pageNotes.length === 0){
      $empty.style.display = "flex";
      return;
    }
    $empty.style.display = "none";

    pageNotes.forEach(function(note, i){
      var div = document.createElement("div");
      div.className = "item" + (i === state.selIndex ? " sel" : "");
      var firstLine = (note.text || "").split("\n")[0] || "(내용 없음)";
      div.innerHTML = '<div class="t"></div><div class="d"></div>';
      div.querySelector(".t").textContent = firstLine;
      div.querySelector(".d").textContent = fmtDate(note.updatedAt);
      div.addEventListener("click", function(){
        state.selIndex = i;
        renderList();
      });
      $list.appendChild(div);
    });
  }

  function getSelectedNote(){
    var notes = sortedNotes();
    var start = state.page * PAGE_SIZE;
    var pageNotes = notes.slice(start, start + PAGE_SIZE);
    return pageNotes[state.selIndex] || null;
  }

  function renderDetail(){
    var note = state.notes.find(function(n){ return n.id === state.currentNoteId; });
    if(!note){
      goToList();
      return;
    }
    $detailDate.textContent = fmtDate(note.updatedAt);
    $detailBody.textContent = note.text || "";
  }

  // ---------- navigation actions ----------
  function goToList(){
    state.mode = "list";
    state.page = 0; // 목록 제일 최신 페이지로
    state.selIndex = 0;
    closeConfirm();
    render();
  }

  function openSelectedNote(){
    var note = getSelectedNote();
    if(!note) return;
    state.currentNoteId = note.id;
    state.mode = "detail";
    render();
  }

  function startEditCurrent(){
    var note = state.notes.find(function(n){ return n.id === state.currentNoteId; });
    if(!note) return;
    state.editingNoteId = note.id;
    $textarea.value = note.text || "";
    state.mode = "write";
    render();
    setTimeout(function(){ $textarea.focus(); }, 0);
  }

  function startNewNote(){
    state.editingNoteId = null;
    $textarea.value = "";
    state.mode = "write";
    render();
    setTimeout(function(){ $textarea.focus(); }, 0);
  }

  function saveAndExitWrite(){
    var text = $textarea.value;
    var hasContent = text.trim().length > 0;

    if(state.editingNoteId){
      var note = state.notes.find(function(n){ return n.id === state.editingNoteId; });
      if(note){
        if(hasContent){
          note.text = text;
          note.updatedAt = Date.now();
        } else {
          // emptied out an existing note -> delete it
          state.notes = state.notes.filter(function(n){ return n.id !== state.editingNoteId; });
        }
      }
      saveNotes();
      if(hasContent){
        state.mode = "detail";
        state.currentNoteId = state.editingNoteId;
      } else {
        goToList();
        return;
      }
    } else {
      if(hasContent){
        var id = "n" + Date.now() + Math.random().toString(36).slice(2,7);
        state.notes.push({ id:id, text:text, updatedAt: Date.now() });
        saveNotes();
        state.mode = "list";
        state.page = 0;
        state.selIndex = 0;
      } else {
        state.mode = "list";
      }
    }
    render();
  }

  function openConfirmDelete(){
    state.confirmOpen = true;
    $confirmModal.classList.add("active");
  }
  function closeConfirm(){
    state.confirmOpen = false;
    $confirmModal.classList.remove("active");
  }
  function confirmDeleteYes(){
    state.notes = state.notes.filter(function(n){ return n.id !== state.currentNoteId; });
    saveNotes();
    closeConfirm();
    goToList();
  }

  // ---------- key handling ----------
  function handleKeyList(key){
    var notes = sortedNotes();
    var tp = totalPages();
    var start = state.page * PAGE_SIZE;
    var pageCount = notes.slice(start, start + PAGE_SIZE).length;

    if(key === "ArrowUp"){
      if(state.selIndex > 0){
        state.selIndex--;
      } else if(state.page > 0){
        state.page--;
        state.selIndex = PAGE_SIZE - 1;
      }
      render();
    } else if(key === "ArrowDown"){
      if(state.selIndex < pageCount - 1){
        state.selIndex++;
      } else if(state.page < tp - 1){
        state.page++;
        state.selIndex = 0;
      }
      render();
    } else if(key === "ArrowLeft"){
      if(state.page > 0){
        state.page--;
        state.selIndex = 0;
        render();
      }
    } else if(key === "ArrowRight"){
      if(state.page < tp - 1){
        state.page++;
        state.selIndex = 0;
        render();
      }
    } else if(key === "1"){
      openSelectedNote();
    } else if(key === "0"){
      startNewNote();
    }
  }

  function handleKeyDetail(key){
    if(state.confirmOpen){
      if(key === "1"){ confirmDeleteYes(); }
      else if(key === "2"){ closeConfirm(); }
      return;
    }
    if(key === "1"){
      startEditCurrent();
    } else if(key === "2"){
      goToList();
    } else if(key === "3"){
      openConfirmDelete();
    }
  }

  document.addEventListener("keydown", function(e){
    var key = e.key;
    var navKeys = ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","0","1","2","3","Backspace","Escape"];

    if(state.mode === "write"){
      // 뒤로가기: Backspace(빈 textarea일 때 브라우저 뒤로가기 방지) or Escape as "back"
      if(key === "Escape"){
        e.preventDefault();
        saveAndExitWrite();
      }
      return; // no number shortcuts in write mode
    }

    if(navKeys.indexOf(key) === -1) return;

    if(state.mode === "list"){
      e.preventDefault();
      handleKeyList(key);
    } else if(state.mode === "detail"){
      e.preventDefault();
      handleKeyDetail(key);
    }
  });

  // physical/back button fallback for write mode: use browser back button via popstate,
  // and provide an on-screen way (Escape key above). Also handle Android back via history.
  window.addEventListener("popstate", function(){
    if(state.mode === "write"){
      saveAndExitWrite();
      history.pushState({app:true}, "");
    }
  });
  history.pushState({app:true}, "");

  $newbtn.addEventListener("click", function(){
    startNewNote();
  });

  // click on modal buttons via touch too
  $confirmModal.addEventListener("click", function(e){
    // no-op, keyboard only per spec, but allow tap on 삭제/취소 text for touch screens
  });

  // ---------- init ----------
  loadNotes();
  render();
})();
</script>
</body>
</html>
