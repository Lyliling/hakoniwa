<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>메모장</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100%;overflow:hidden;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-text-size-adjust:100%}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;overflow:hidden}
#body{-webkit-flex:1 1 auto;flex:1 1 auto;position:relative;overflow:hidden;min-height:0}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;display:none;-webkit-flex-direction:column;flex-direction:column}
.screen.active{display:-webkit-flex;display:flex}

#list-items,#detail{-webkit-flex:1 1 auto;flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.item{padding:.6rem .8rem;cursor:pointer}
.item .t{font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{font-size:.8rem;margin-top:.15rem}
#empty{-webkit-flex:1 1 auto;flex:1 1 auto;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;font-size:1rem}

#detail{padding:.8rem;font-size:1rem;line-height:1.6}
#detail-date{display:block;font-size:.8rem;padding-bottom:.5rem;margin-bottom:.7rem}
#detail-body{display:block;white-space:pre-wrap;word-wrap:break-word;word-break:break-all}

#write-textarea{-webkit-flex:1 1 auto;flex:1 1 auto;min-height:0;width:100%;border:none;outline:none;resize:none;padding:.8rem;font-size:1rem;line-height:1.6;font-family:inherit;border-radius:0;-webkit-appearance:none;-webkit-user-select:text;user-select:text}
.charcount{-webkit-flex:0 0 auto;flex:0 0 auto;text-align:right;padding:.25rem .8rem;font-size:.8rem}

.toolbar{-webkit-flex:0 0 auto;flex:0 0 auto;display:-webkit-flex;display:flex}
.toolbar button{-webkit-flex:1 1 0;flex:1 1 0;min-width:0;border:none;padding:.7rem 0;font-size:.95rem;font-family:inherit;white-space:nowrap;border-radius:0;cursor:pointer}
.toolbar button:last-child{border-right:none}
.toolbar button.tb-settings{-webkit-flex:0 0 2.6rem;flex:0 0 2.6rem;font-size:1.1rem}

#confirm-modal,#settings-modal{position:absolute;left:.8rem;right:.8rem;top:50%;-webkit-transform:translateY(-50%);transform:translateY(-50%);padding:1rem .8rem;display:none;z-index:20;font-size:1rem}
#confirm-modal.active,#settings-modal.active{display:block}
#confirm-modal .msg{margin-bottom:.9rem}
#confirm-modal .opts{display:-webkit-flex;display:flex}
#confirm-modal .opts button{-webkit-flex:1 1 0;flex:1 1 0;padding:.6rem 0;font-size:1rem;font-family:inherit;border-radius:0;cursor:pointer}
#confirm-modal .opts button + button{margin-left:.6rem}

#settings-modal h3{font-size:1.1rem;margin-bottom:.7rem}
.setting-row{margin-bottom:.8rem}
.setting-row label{display:block;font-size:.8rem;margin-bottom:.3rem}
.setting-row .choices{display:-webkit-flex;display:flex}
.setting-row .choices button{-webkit-flex:1 1 0;flex:1 1 0;min-width:0;padding:.5rem 0;font-size:.85rem;font-family:inherit;white-space:nowrap;border-radius:0;cursor:pointer}
.setting-row .choices button + button{margin-left:.3rem}
#settings-close{display:block;width:100%;padding:.6rem 0;font-size:1rem;font-family:inherit;border-radius:0;cursor:pointer}

/* 스크롤바는 숨기고 터치 스크롤은 유지 */
#list-items::-webkit-scrollbar,#detail::-webkit-scrollbar,#write-textarea::-webkit-scrollbar{display:none;width:0;height:0}

body,#app{background:#000;color:#fff}
.item{border-bottom:1px solid #444}
.item .d{color:#888}
.item:active{background:#fff;color:#000}
.item:active .d{color:#555}
#empty{color:#888}
#detail-date{color:#888;border-bottom:1px solid #444}
#write-textarea{background:#000;color:#fff}
.charcount{color:#888;border-top:1px solid #444}
.toolbar{border-top:1px solid #444}
.toolbar button{background:#000;color:#fff;border-right:1px solid #444}
.toolbar button:active{background:#fff;color:#000}
.toolbar button:disabled{color:#888}
#confirm-modal,#settings-modal{background:#fff;color:#000;border:2px solid #fff}
#confirm-modal .opts button{border:1px solid #000;background:#fff;color:#000}
#confirm-modal .opts button.danger{background:#000;color:#fff}
.setting-row label{color:#555}
.setting-row .choices button{border:1px solid #000;background:#fff;color:#000}
.setting-row .choices button.active{background:#000;color:#fff}
#settings-close{border:1px solid #000;background:#000;color:#fff}

html.light body,html.light #app{background:#fff;color:#000}
html.light .item{border-bottom:1px solid #ccc}
html.light .item .d{color:#666}
html.light .item:active{background:#000;color:#fff}
html.light .item:active .d{color:#999}
html.light #empty{color:#666}
html.light #detail-date{color:#666;border-bottom:1px solid #ccc}
html.light #write-textarea{background:#fff;color:#000}
html.light .charcount{color:#666;border-top:1px solid #ccc}
html.light .toolbar{border-top:1px solid #ccc}
html.light .toolbar button{background:#fff;color:#000;border-right:1px solid #ccc}
html.light .toolbar button:active{background:#000;color:#fff}
html.light .toolbar button:disabled{color:#666}
html.light #confirm-modal,html.light #settings-modal{background:#000;color:#fff;border:2px solid #000}
html.light #confirm-modal .opts button{border:1px solid #fff;background:#000;color:#fff}
html.light #confirm-modal .opts button.danger{background:#fff;color:#000}
html.light .setting-row label{color:#999}
html.light .setting-row .choices button{border:1px solid #fff;background:#000;color:#fff}
html.light .setting-row .choices button.active{background:#fff;color:#000}
html.light #settings-close{border:1px solid #fff;background:#fff;color:#000}
</style>
</head>
<body>
<div id="app">
  <div id="body">
    <div class="screen active" id="screen-list">
      <div id="list-items"></div>
      <div id="empty" style="display:none;">메모가 없습니다</div>
      <div class="toolbar">
        <button id="btn-prev">◀ 이전</button>
        <button id="btn-newmemo">새 메모</button>
        <button id="btn-next">다음 ▶</button>
        <button class="tb-settings" title="설정">⚙</button>
      </div>
    </div>

    <div class="screen" id="screen-detail">
      <div id="detail">
        <span id="detail-date"></span>
        <span id="detail-body"></span>
      </div>
      <div id="detail-charcount" class="charcount">0자</div>
      <div class="toolbar">
        <button id="btn-edit">편집</button>
        <button id="btn-tolist">목록</button>
        <button id="btn-delete">삭제</button>
        <button class="tb-settings" title="설정">⚙</button>
      </div>
    </div>

    <div class="screen" id="screen-write">
      <textarea id="write-textarea" placeholder="메모를 입력하세요..." spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off"></textarea>
      <div id="write-charcount" class="charcount">0자</div>
      <div class="toolbar">
        <button id="btn-save">저장</button>
      </div>
    </div>

    <div id="confirm-modal">
      <div class="msg">정말 삭제하시겠습니까?</div>
      <div class="opts">
        <button class="danger" id="confirm-yes">삭제</button>
        <button id="confirm-no">취소</button>
      </div>
    </div>

    <div id="settings-modal">
      <h3>설정</h3>
      <div class="setting-row">
        <label>글자 크기</label>
        <div class="choices" id="fontsize-choices">
          <button data-size="11">작게</button>
          <button data-size="13">보통</button>
          <button data-size="15">크게</button>
          <button data-size="18">특대</button>
        </div>
      </div>
      <div class="setting-row">
        <label>화면 색상</label>
        <div class="choices" id="theme-choices">
          <button data-theme="dark">검정</button>
          <button data-theme="light">흰색</button>
        </div>
      </div>
      <button id="settings-close">닫기</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // 메모 데이터는 다른 버전(PC/태블릿용 index.html)과 같은 키를 써서 같은 기기·같은 주소에서는 공유된다.
  var STORAGE_KEY = "memoapp_v1_notes";
  var SETTINGS_KEY = "memoapp_f2_settings";

  var state = { notes: [], mode: "list", page: 0, currentNoteId: null, editingNoteId: null, confirmOpen: false, settingsOpen: false };
  var settings = { fontSize: 13, theme: "dark" };

  // ---------- 구형 브라우저용 도우미 ----------
  function each(list, fn){ for(var i = 0; i < list.length; i++){ fn(list[i], i); } }
  function byId(id){ return document.getElementById(id); }
  function findNote(id){
    for(var i = 0; i < state.notes.length; i++){ if(state.notes[i].id === id) return state.notes[i]; }
    return null;
  }
  function hasClass(el, c){ return (" " + el.className + " ").indexOf(" " + c + " ") > -1; }
  function addClass(el, c){ if(!hasClass(el, c)) el.className = (el.className ? el.className + " " : "") + c; }
  function removeClass(el, c){ el.className = (" " + el.className + " ").replace(" " + c + " ", " ").replace(/^\s+|\s+$/g, ""); }
  function setActive(el, on){ if(on) addClass(el, "active"); else removeClass(el, "active"); }
  function isInteractive(el){
    while(el && el !== document.body){
      var t = el.tagName;
      if(t === "BUTTON" || t === "TEXTAREA" || t === "INPUT" || (el.className && hasClass(el, "item"))) return true;
      el = el.parentNode;
    }
    return false;
  }
  function keyOf(e){
    if(e.key) return e.key;
    if(e.keyCode === 27) return "Escape";
    if(e.keyCode === 83) return "s";
    return "";
  }

  // ---------- storage ----------
  function loadNotes(){
    try{ var raw = localStorage.getItem(STORAGE_KEY); state.notes = raw ? JSON.parse(raw) : []; }
    catch(e){ state.notes = []; }
  }
  function saveNotes(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.notes)); }catch(e){} }
  function loadSettings(){
    try{
      var raw = localStorage.getItem(SETTINGS_KEY);
      if(raw){ var s = JSON.parse(raw); settings.fontSize = s.fontSize || 13; settings.theme = s.theme || "dark"; }
    }catch(e){}
  }
  function saveSettings(){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(e){} }

  function pageSize(){
    var f = settings.fontSize;
    return f <= 11 ? 6 : (f <= 13 ? 5 : (f <= 15 ? 4 : 3));
  }
  function applySettings(){
    document.documentElement.style.fontSize = settings.fontSize + "px";
    if(settings.theme === "light") addClass(document.documentElement, "light");
    else removeClass(document.documentElement, "light");
    each(byId("fontsize-choices").getElementsByTagName("button"), function(b){
      setActive(b, parseInt(b.getAttribute("data-size"), 10) === settings.fontSize);
    });
    each(byId("theme-choices").getElementsByTagName("button"), function(b){
      setActive(b, b.getAttribute("data-theme") === settings.theme);
    });
  }

  function sortedNotes(){ return state.notes.slice().sort(function(a, b){ return b.updatedAt - a.updatedAt; }); }
  function totalPages(){ return Math.max(1, Math.ceil(state.notes.length / pageSize())); }

  // ---------- DOM refs ----------
  var $list = byId("list-items"), $empty = byId("empty");
  var $screenList = byId("screen-list"), $screenDetail = byId("screen-detail"), $screenWrite = byId("screen-write");
  var $detailBody = byId("detail-body"), $detailDate = byId("detail-date");
  var $textarea = byId("write-textarea");
  var $writeCharcount = byId("write-charcount"), $detailCharcount = byId("detail-charcount");
  var $confirmModal = byId("confirm-modal"), $settingsModal = byId("settings-modal");
  var $btnPrev = byId("btn-prev"), $btnNext = byId("btn-next");

  function fmtDate(ts){
    var d = new Date(ts);
    function p(n){ return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "." + p(d.getMonth() + 1) + "." + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  // 글자수 계산: 공백류, 마침표, 큰따옴표, 작은따옴표, 느낌표, 물음표 제외
  function countChars(text){ return text ? text.replace(/[\s.'"!?]/g, "").length : 0; }
  function updateWriteCharcount(){ $writeCharcount.textContent = countChars($textarea.value) + "자"; }

  // ---------- render ----------
  function render(){
    setActive($screenList, state.mode === "list");
    setActive($screenDetail, state.mode === "detail");
    setActive($screenWrite, state.mode === "write");
    if(state.mode === "list") renderList();
    else if(state.mode === "detail") renderDetail();
  }

  function renderList(){
    var notes = sortedNotes(), tp = totalPages(), size = pageSize();
    if(state.page >= tp) state.page = tp - 1;
    if(state.page < 0) state.page = 0;
    var pageNotes = notes.slice(state.page * size, state.page * size + size);

    $btnPrev.disabled = state.page <= 0;
    $btnNext.disabled = state.page >= tp - 1;

    $list.innerHTML = "";
    if(pageNotes.length === 0){ $empty.style.display = "flex"; $list.style.display = "none"; return; }
    $empty.style.display = "none"; $list.style.display = "block";

    each(pageNotes, function(note){
      var div = document.createElement("div");
      div.className = "item";
      var t = document.createElement("div"); t.className = "t";
      t.textContent = (note.text || "").split("\n")[0] || "(내용 없음)";
      var d = document.createElement("div"); d.className = "d";
      d.textContent = fmtDate(note.updatedAt);
      div.appendChild(t); div.appendChild(d);
      div.addEventListener("click", function(){ state.currentNoteId = note.id; state.mode = "detail"; render(); });
      $list.appendChild(div);
    });
    $list.scrollTop = 0;
  }

  function renderDetail(){
    var note = findNote(state.currentNoteId);
    if(!note){ goToList(); return; }
    $detailDate.textContent = fmtDate(note.updatedAt);
    $detailBody.textContent = note.text || "";
    $detailCharcount.textContent = countChars(note.text) + "자";
    byId("detail").scrollTop = 0;
  }

  // ---------- actions ----------
  function goToList(){ state.mode = "list"; state.page = 0; closeConfirm(); render(); }

  function startEditCurrent(){
    var note = findNote(state.currentNoteId);
    if(!note) return;
    state.editingNoteId = note.id;
    $textarea.value = note.text || "";
    state.mode = "write"; render(); updateWriteCharcount();
    setTimeout(function(){ $textarea.focus(); }, 0);
  }
  function startNewNote(){
    state.editingNoteId = null;
    $textarea.value = "";
    state.mode = "write"; render(); updateWriteCharcount();
    setTimeout(function(){ $textarea.focus(); }, 0);
  }
  function newId(){ return "n" + Date.now() + Math.random().toString(36).slice(2, 7); }

  // 저장하고 상세보기로 (새 글은 저장 후 그 글의 상세보기). 내용이 비어 있으면 저장하지 않고 목록으로.
  function saveToDetail(){
    var text = $textarea.value;
    if(text.replace(/^\s+|\s+$/g, "").length === 0){
      if(state.editingNoteId){ // 편집하다 전부 지우면 그 메모 삭제
        var keep = [];
        each(state.notes, function(n){ if(n.id !== state.editingNoteId) keep.push(n); });
        state.notes = keep; saveNotes();
      }
      state.editingNoteId = null; goToList(); return;
    }
    if(state.editingNoteId){
      var note = findNote(state.editingNoteId);
      if(note){ note.text = text; note.updatedAt = Date.now(); }
      state.currentNoteId = state.editingNoteId;
    } else {
      var id = newId();
      state.notes.push({ id: id, text: text, updatedAt: Date.now() });
      state.currentNoteId = id;
    }
    saveNotes();
    state.editingNoteId = null; state.mode = "detail"; render();
  }

  function openConfirmDelete(){ state.confirmOpen = true; addClass($confirmModal, "active"); }
  function closeConfirm(){ state.confirmOpen = false; removeClass($confirmModal, "active"); }
  function confirmDeleteYes(){
    var keep = [];
    each(state.notes, function(n){ if(n.id !== state.currentNoteId) keep.push(n); });
    state.notes = keep; saveNotes(); closeConfirm(); goToList();
  }
  function openSettings(){ state.settingsOpen = true; addClass($settingsModal, "active"); }
  function closeSettings(){ state.settingsOpen = false; removeClass($settingsModal, "active"); }

  // ---------- 버튼 연결 ----------
  byId("btn-newmemo").addEventListener("click", startNewNote);
  $btnPrev.addEventListener("click", function(){ if(state.page > 0){ state.page--; renderList(); } });
  $btnNext.addEventListener("click", function(){ if(state.page < totalPages() - 1){ state.page++; renderList(); } });
  byId("btn-edit").addEventListener("click", startEditCurrent);
  byId("btn-tolist").addEventListener("click", goToList);
  byId("btn-delete").addEventListener("click", openConfirmDelete);
  byId("btn-save").addEventListener("click", saveToDetail);
  byId("confirm-yes").addEventListener("click", confirmDeleteYes);
  byId("confirm-no").addEventListener("click", closeConfirm);
  $textarea.addEventListener("input", updateWriteCharcount);
  byId("settings-close").addEventListener("click", closeSettings);
  each(document.getElementsByClassName("tb-settings"), function(b){ b.addEventListener("click", openSettings); });
  each(byId("fontsize-choices").getElementsByTagName("button"), function(b){
    b.addEventListener("click", function(){
      settings.fontSize = parseInt(b.getAttribute("data-size"), 10);
      saveSettings(); applySettings(); render();
    });
  });
  each(byId("theme-choices").getElementsByTagName("button"), function(b){
    b.addEventListener("click", function(){ settings.theme = b.getAttribute("data-theme"); saveSettings(); applySettings(); });
  });

  // ---------- 뒤로가기(기기 뒤로가기 키/제스처) ----------
  // 설정창/삭제확인 닫기 -> 작성 중이면 저장 후 상세보기 -> 상세보기면 목록 -> 목록이면 페이지에서 나감
  function handleBack(){
    if(state.settingsOpen){ closeSettings(); return true; }
    if(state.confirmOpen){ closeConfirm(); return true; }
    if(state.mode === "write"){ saveToDetail(); return true; }
    if(state.mode === "detail"){ goToList(); return true; }
    return false;
  }
  try{ history.pushState({ app: 1 }, ""); }catch(e){}
  window.addEventListener("popstate", function(){
    if(handleBack()){ try{ history.pushState({ app: 1 }, ""); }catch(e){} }
    else { try{ history.back(); }catch(e){} }
  });

  // 키보드가 연결된 경우: Ctrl+S / Esc 로 저장
  document.addEventListener("keydown", function(e){
    var k = keyOf(e);
    var ctrlS = (e.ctrlKey || e.metaKey) && (k === "s" || k === "S");
    if(ctrlS || k === "Escape" || k === "Esc"){
      if(state.mode === "write"){ e.preventDefault(); saveToDetail(); }
      else if(state.mode === "detail" && !ctrlS){ e.preventDefault(); goToList(); }
      else if(ctrlS){ e.preventDefault(); }
    }
  });

  // ---------- 전체화면: 빈 곳을 빠르게 두 번 탭하면 켜기/끄기 ----------
  function fsElement(){ return document.fullscreenElement || document.webkitFullscreenElement; }
  function toggleFullscreen(){
    var el = document.documentElement;
    try{
      if(!fsElement()){
        if(el.requestFullscreen) el.requestFullscreen();
        else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if(document.exitFullscreen) document.exitFullscreen();
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }catch(e){}
  }
  var lastTap = 0;
  document.body.addEventListener("touchend", function(e){
    if(isInteractive(e.target)) return;
    var now = new Date().getTime();
    if(now - lastTap < 350){ toggleFullscreen(); lastTap = 0; }
    else { lastTap = now; }
  });

  // ---------- 시작 ----------
  loadNotes(); loadSettings(); applySettings(); render();
})();
</script>
</body>
</html>
